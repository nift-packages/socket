name: socket

# Cross-platform certification for the socket package (SERVER1). Builds the
# current nift-dev/nift main and runs the package's self-contained loopback
# contract on Linux, macOS and Windows x64. Python is used only by the test
# harness; the production package is pure Nift FFI.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    name: ${{ matrix.os }} socket contract
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: socket
      - uses: actions/checkout@v5
        with:
          repository: nift-dev/nift
          ref: main
          path: nift
      - uses: actions/setup-python@v6
        if: runner.os == 'Windows'
        with:
          python-version: '3.x'
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-winpthreads
      - name: Build Nift
        if: runner.os != 'Windows'
        run: make -C nift -j2
      - name: Build Nift on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make -C nift -j2
      - name: Socket contract
        if: runner.os != 'Windows'
        run: python3 socket/tests/socket_test.py "$PWD/nift/nift" "$PWD/socket"
      - name: Socket contract on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export PATH="$PATH:$(cygpath -u "$pythonLocation")"
          python3 --version
          NIFT="$(cygpath -w "$PWD/nift/nift.exe")"
          PKG="$(cygpath -w "$PWD/socket")"
          python3 socket/tests/socket_test.py "$NIFT" "$PKG"